local_planner_node:
  ros__parameters:
    # Path Parameters
    pathFolder: ""  # Set via launch to $(find-pkg-share local_planner)/paths

    # Goal Parameters
    goalX: 0.0
    goalY: 0.0
    goalCloseDis: 0.4
    goalClearRange: 0.5

    # Vehicle Parameters
    vehicleLength: 0.7
    vehicleWidth: 0.4
    sensorOffsetX: 0.3
    sensorOffsetY: 0.0
    twoWayDrive: false

    # Sensor Parameters
    laserVoxelSize: 0.05
    terrainVoxelSize: 0.2
    useTerrainAnalysis: true

    # Obstacle Detection
    checkObstacle: true
    checkRotObstacle: false
    adjacentRange: 3.0
    obstacleHeightThre: 0.3
    groundHeightThre: 0.1
    costHeightThre: 0.1
    costScore: 0.02
    useCost: false

    # Path Planning Parameters
    pointPerPathThre: 2
    minRelZ: -0.5
    maxRelZ: 0.25
    maxSpeed: 0.6
    dirWeight: 0.02
    dirThre: 90.0
    dirToVehicle: false
    pathScale: 0.75
    minPathScale: 0.5
    pathScaleStep: 0.25
    pathScaleBySpeed: true
    minPathRange: 1.0
    pathRangeStep: 0.5
    pathRangeBySpeed: true
    pathCropByGoal: true

    # Autonomy Mode
    autonomyMode: false
    autonomySpeed: 1.0
    joyToSpeedDelay: 2.0
    joyToCheckObstacleDelay: 5.0
